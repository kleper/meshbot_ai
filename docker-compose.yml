services:
  meshtastic-bot:
    build: .
    image: meshtastic-ai-bot:latest
    container_name: meshtastic-ai-bot
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./app:/app/app
      - ./tests:/app/tests
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
