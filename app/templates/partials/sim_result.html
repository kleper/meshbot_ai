<div class="sim-telemetry-panel">
  <div class="sim-telemetry-header">
    <span>Entrada: <strong class="sim-telemetry-input">{{ sim_result.input }}</strong></span>
    <span class="sim-telemetry-metrics">
      <span>Latencia: <strong class="sim-metric-accent">{{ sim_result.latency_ms }} ms</strong></span>
      <span aria-hidden="true">·</span>
      <span>Paquetes LoRa: <strong class="sim-metric-val">{{ sim_result.packet_count }}</strong></span>
    </span>
  </div>

  {% for pkt in sim_result.packets %}
    <div class="pkt-box">
      <div class="pkt-header">
        <span class="pkt-index">Paquete {{ loop.index }}/{{ sim_result.packet_count }}</span>
        <span class="pkt-bytes">{{ sim_result.packet_bytes[loop.index0] }} / 228 bytes UTF-8</span>
      </div>
      <div class="pkt-payload">{{ pkt }}</div>
    </div>
  {% endfor %}
</div>
