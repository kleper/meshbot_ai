<div class="status-pills" aria-label="Estado del nodo y sistema local">
  <span class="pill pill-telemetry">
    <span class="dot {% if interface_healthy %}ok{% endif %}" aria-hidden="true"></span>
    <span>
      {% if interface_healthy %}
        LoRa OK · {{ channel_name }}
      {% else %}
        Reconectando LoRa…
      {% endif %}
    </span>
  </span>
  <span class="pill pill-telemetry" title="Modelo LLM ejecutándose en NPU Hailo-10H">
    <svg class="icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="4" y="4" width="16" height="16" rx="2" />
      <rect x="9" y="9" width="6" height="6" />
      <path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3" />
    </svg>
    <span>{{ ollama_model }}</span>
  </span>
  <span class="pill pill-telemetry" title="Total de registros indexados en SQLite FTS5">
    <svg class="icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <ellipse cx="12" cy="5" rx="9" ry="3" />
      <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" />
      <path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3" />
    </svg>
    <span>{{ total_kb_items }} fichas</span>
  </span>
  <a href="/static/mapa.html"
     target="_blank"
     rel="noopener"
     class="pill pill-telemetry pill-link"
     title="Abrir Mapa Topográfico y Estudio RF (Playa Rica ↔ Carolina del Príncipe)">
    <svg class="icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21" />
      <line x1="9" y1="3" x2="9" y2="18" />
      <line x1="15" y1="6" x2="15" y2="21" />
    </svg>
    <span>Mapa RF</span>
  </a>
</div>
